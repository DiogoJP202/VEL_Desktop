<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="VEL (Virtual Easy Log): plataforma de gestão de entregas para restaurantes e frotas — pedidos digitais, entregadores e visão financeira."
    />
    <meta name="theme-color" content="#0f172a" />
    <link rel="shortcut icon" href="/images/VEL.png" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Virtual Easy Log</title>
    <style>
      :root {
        color-scheme: dark;
        --bg-1: #020617;
        --bg-2: #0f172a;
        --accent: #3b82f6;
        --accent-soft: rgba(59, 130, 246, 0.35);
        --text-1: #f8fafc;
        --text-2: #cbd5e1;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        padding: 0;
        font-family: Inter, Segoe UI, Roboto, Arial, sans-serif;
        background: radial-gradient(circle at 20% 15%, #1e293b 0%, transparent 35%),
          radial-gradient(circle at 80% 80%, #172554 0%, transparent 35%),
          linear-gradient(145deg, var(--bg-1), var(--bg-2));
        overflow-x: hidden;
        overflow-y: auto;
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        border-radius: 50%;
        filter: blur(18px);
        pointer-events: none;
        z-index: 0;
        animation: floatGlow 8s ease-in-out infinite;
      }

      body::before {
        width: 220px;
        height: 220px;
        top: -60px;
        left: -40px;
        background: rgba(14, 165, 233, 0.25);
      }

      body::after {
        width: 260px;
        height: 260px;
        right: -90px;
        bottom: -90px;
        background: rgba(37, 99, 235, 0.25);
        animation-delay: 1.5s;
      }

      #root {
        min-height: 100vh;
        position: relative;
        z-index: 1;
      }

      .app-splash {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .splash-card {
        width: min(420px, 100%);
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 20px;
        padding: 28px 24px;
        text-align: center;
        color: var(--text-1);
        background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(10px);
        box-shadow: 0 18px 48px rgba(2, 6, 23, 0.45);
        animation: cardEnter 0.65s ease-out forwards;
      }

      .splash-logo {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        margin-bottom: 14px;
        box-shadow: 0 8px 24px var(--accent-soft);
        animation: logoPulse 2.1s ease-in-out infinite;
      }

      .splash-title {
        margin: 0;
        font-size: clamp(1.2rem, 2vw, 1.45rem);
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .splash-subtitle {
        margin: 10px 0 18px;
        color: var(--text-2);
        font-size: 0.94rem;
      }

      .splash-loader {
        width: 100%;
        height: 6px;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.25);
        overflow: hidden;
      }

      .splash-loader::after {
        content: "";
        display: block;
        width: 45%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #38bdf8, var(--accent));
        box-shadow: 0 0 14px rgba(59, 130, 246, 0.6);
        animation: loadingSlide 1.4s ease-in-out infinite;
      }

      @keyframes cardEnter {
        from {
          opacity: 0;
          transform: translateY(14px) scale(0.985);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes logoPulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.045);
        }
      }

      @keyframes loadingSlide {
        0% {
          transform: translateX(-120%);
        }
        50% {
          transform: translateX(80%);
        }
        100% {
          transform: translateX(220%);
        }
      }

      @keyframes floatGlow {
        0%,
        100% {
          transform: translateY(0px) translateX(0px);
        }
        50% {
          transform: translateY(10px) translateX(8px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-splash">
        <div class="splash-card" role="status" aria-live="polite" aria-label="Carregando aplicacao">
          <img class="splash-logo" src="/images/VEL.png" alt="Logo VEL" />
          <h1 class="splash-title">Virtual Easy Log</h1>
          <p class="splash-subtitle">Carregando sua experiencia...</p>
          <div class="splash-loader" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
